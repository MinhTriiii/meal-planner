[project]
name = "meal-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MinhTriiii", email = "minhtrihoang1603@gmail.com" }
]
requires-python = ">=3.15"
dependencies = []

[project.scripts]
meal-planner = "meal_planner:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]
extend-select = ["COM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
